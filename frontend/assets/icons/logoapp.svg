<svg id="notepad-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="graphiteHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#343841" />
      <stop offset="55%" stop-color="#23262C" />
      <stop offset="100%" stop-color="#16181C" />
    </linearGradient>

    <linearGradient id="yellowAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>

    <linearGradient id="pageSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <linearGradient id="ringMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="35%" stop-color="#FFFFFF" />
      <stop offset="75%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <filter id="notepadShadow" x="-15%" y="-12%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#090A0D" flood-opacity="0.32" />
    </filter>

    <filter id="ringShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#090A0D" flood-opacity="0.35" />
    </filter>

    <clipPath id="frontPageClip">
      <rect x="68" y="64" width="376" height="388" rx="34" />
    </clipPath>
  </defs>

  <rect x="84" y="88" width="344" height="388" rx="34" fill="#64748B" />
  <rect x="76" y="76" width="360" height="388" rx="34" fill="#CBD5E1" />

  <g filter="url(#notepadShadow)">
    <rect x="68" y="64" width="376" height="388" rx="34" fill="url(#pageSurface)" />

    <g clip-path="url(#frontPageClip)">
      <rect x="68" y="64" width="376" height="96" fill="url(#graphiteHeader)" />
      <rect x="68" y="64" width="376" height="3" fill="#FFFFFF" fill-opacity="0.16" />
      <rect x="68" y="152" width="376" height="12" fill="url(#yellowAccent)" />
    </g>

    <rect x="69" y="65" width="374" height="386" rx="33" fill="none" stroke="#1E2025" stroke-opacity="0.14" stroke-width="2" />
  </g>

  <g>
    <circle cx="128" cy="92" r="11" fill="#0D0E11" />
    <circle cx="192" cy="92" r="11" fill="#0D0E11" />
    <circle cx="256" cy="92" r="11" fill="#0D0E11" />
    <circle cx="320" cy="92" r="11" fill="#0D0E11" />
    <circle cx="384" cy="92" r="11" fill="#0D0E11" />

    <g filter="url(#ringShadow)">
      <rect x="120" y="32" width="16" height="62" rx="8" fill="url(#ringMetal)" />
      <rect x="184" y="32" width="16" height="62" rx="8" fill="url(#ringMetal)" />
      <rect x="248" y="32" width="16" height="62" rx="8" fill="url(#ringMetal)" />
      <rect x="312" y="32" width="16" height="62" rx="8" fill="url(#ringMetal)" />
      <rect x="376" y="32" width="16" height="62" rx="8" fill="url(#ringMetal)" />
    </g>
  </g>

  <g>
    <rect x="112" y="206" width="168" height="22" rx="11" fill="url(#yellowAccent)" />
    <rect x="112" y="256" width="288" height="20" rx="10" fill="#94A3B8" />
    <rect x="112" y="304" width="252" height="20" rx="10" fill="#CBD5E1" />
    <rect x="112" y="352" width="192" height="20" rx="10" fill="#CBD5E1" />
  </g>
</svg>
